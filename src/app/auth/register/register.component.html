<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="fill">
    <mat-label>Username</mat-label>
    <input matInput formControlName="username" placeholder="Choose a username">
    <mat-error *ngIf="form.get('username')?.hasError('required')">
      Username is required
    </mat-error>
    <mat-error *ngIf="form.get('username')?.hasError('minlength')">
      Username must be at least 3 characters
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Password</mat-label>
    <input matInput type="password" [type]="hidePassword ? 'password' : 'text'"
           formControlName="password" placeholder="Enter password">
    <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" aria-label="Toggle password visibility">
      <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
    <mat-error *ngIf="form.get('password')?.hasError('required')">
      Password is required
    </mat-error>
    <mat-error *ngIf="form.get('password')?.hasError('minlength')">
      Password must be at least 6 characters
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Confirm Password</mat-label>
    <input matInput type="password" [type]="hideConfirm ? 'password' : 'text'"
           formControlName="confirmPassword" placeholder="Confirm password">
    <button mat-icon-button matSuffix (click)="hideConfirm = !hideConfirm" aria-label="Toggle password visibility">
      <mat-icon>{{hideConfirm ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
    <mat-error *ngIf="form.get('confirmPassword')?.hasError('required')">
      Please confirm your password
    </mat-error>
    <mat-error *ngIf="form.hasError('mismatch')">
      Passwords do not match
    </mat-error>
  </mat-form-field>

  <div class="button-container">
    <button mat-flat-button color="primary" type="submit" [disabled]="isLoading">
      @if (isLoading) {
        <mat-spinner diameter="20"></mat-spinner>
        Creating account...
      } @else {
        Register
      }
    </button>
  </div>

  <p class="login-link">
    Already have an account? <a routerLink="/auth/login">Login here</a>
  </p>
</form>
