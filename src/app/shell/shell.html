<mat-sidenav-container class="shell-container">
  <!-- Sidebar -->
  <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile" class="sidenav">
    <div class="brand">
      <mat-icon class="brand-icon">hardware</mat-icon>
      <span>I.A HARDWARE</span>
    </div>

    <nav class="nav-links">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        class="nav-item"
        (click)="isMobile && sidenav.close()"
      >
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a
        routerLink="/items"
        routerLinkActive="active"
        class="nav-item"
        (click)="isMobile && sidenav.close()"
      >
        <mat-icon>inventory_2</mat-icon>
        <span>Inventory</span>
      </a>
      <a
        routerLink="/locations"
        routerLinkActive="active"
        class="nav-item"
        (click)="isMobile && sidenav.close()"
      >
        <mat-icon>place</mat-icon>
        <span>Locations</span>
      </a>
      <!-- Divider -->
      <div class="nav-divider"></div>

      <a
        routerLink="/sales"
        routerLinkActive="active"
        class="nav-item"
        (click)="isMobile && sidenav.close()"
      >
        <mat-icon>point_of_sale</mat-icon><span>Sales</span>
      </a>
      <a
        routerLink="/sales/report"
        routerLinkActive="active"
        class="nav-item"
        (click)="isMobile && sidenav.close()"
      >
        <mat-icon>bar_chart</mat-icon><span>Reports</span>
      </a>
      <a
        routerLink="/customers"
        routerLinkActive="active"
        class="nav-item"
        (click)="isMobile && sidenav.close()"
      >
        <mat-icon>people</mat-icon>
        <span>Customers</span>
      </a>
      <a
        routerLink="/borrow"
        routerLinkActive="active"
        class="nav-item"
        (click)="isMobile && sidenav.close()"
      >
        <mat-icon>account_balance_wallet</mat-icon>
        <span>Credit Book</span>
      </a>
    </nav>

    <div class="sidenav-footer">
      <div class="user-info">
        <mat-icon>account_circle</mat-icon>
        <div>
          <div class="username">{{ authService.getUsername() }}</div>
          <div class="role">{{ authService.getRole() }}</div>
        </div>
      </div>
      <button mat-icon-button (click)="logout()" matTooltip="Logout" class="logout-btn">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content class="main-content">
    <!-- Mobile Toolbar: visible only on mobile -->
    @if (isMobile) {
      <div class="mobile-toolbar">
        <button
          mat-icon-button
          class="hamburger-btn"
          (click)="sidenav.toggle()"
          aria-label="Toggle navigation"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <div class="mobile-brand">
          <mat-icon class="brand-icon">hardware</mat-icon>
          <span>HardwareShop</span>
        </div>
      </div>
    }

    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
